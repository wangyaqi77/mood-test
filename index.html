<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪状态自测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f0eb;
  color: #333;
  min-height: 100vh;
}
.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}
/* 首页 */
.home { text-align: center; padding-top: 40px; }
.home h1 { font-size: 26px; color: #5c4a3d; margin-bottom: 12px; }
.home .sub { color: #888; font-size: 14px; margin-bottom: 36px; }
.test-cards { display: flex; flex-direction: column; gap: 16px; }
.card {
  background: #fff;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  transition: transform .15s;
  border: 2px solid transparent;
}
.card:hover { transform: translateY(-2px); border-color: #c4956a; }
.card h3 { font-size: 18px; color: #5c4a3d; margin-bottom: 6px; }
.card p { font-size: 13px; color: #999; line-height: 1.6; }
.card .tag {
  display: inline-block;
  background: #f0e6dc;
  color: #8c6e52;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 20px;
  margin-top: 8px;
}
/* 测试页 */
.test-page { display: none; }
.progress-bar {
  height: 4px;
  background: #e0d8d0;
  border-radius: 2px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #c4956a;
  border-radius: 2px;
  transition: width .3s;
}
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.q-num { font-size: 14px; color: #999; }
.q-text {
  font-size: 18px;
  color: #333;
  line-height: 1.6;
  margin-bottom: 24px;
  min-height: 56px;
}
.options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
.opt-btn {
  display: block;
  width: 100%;
  padding: 14px 16px;
  background: #fff;
  border: 2px solid #e8e0d8;
  border-radius: 12px;
  font-size: 15px;
  color: #555;
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.opt-btn:hover { border-color: #c4956a; background: #fdf8f3; }
.opt-btn.selected { border-color: #c4956a; background: #f5ece3; color: #5c4a3d; font-weight: 600; }
.nav-btns { display: flex; gap: 12px; }
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
  transition: opacity .15s;
}
.btn:active { opacity: .7; }
.btn-prev { background: #e8e0d8; color: #666; }
.btn-next { background: #c4956a; color: #fff; }
.btn-home { background: #e8e0d8; color: #666; margin-top: 20px; width: 100%; }
/* 结果页 */
.result-page { display: none; text-align: center; }
.result-page h2 { font-size: 22px; color: #5c4a3d; margin-bottom: 8px; }
.result-sub { color: #999; font-size: 14px; margin-bottom: 28px; }
.score-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: 700;
  color: #fff;
}
.score-label { font-size: 13px; font-weight: 400; opacity: .9; }
.level-tag {
  display: inline-block;
  padding: 6px 24px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 24px;
}
.advice-box {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  text-align: left;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.advice-box h4 { font-size: 15px; color: #5c4a3d; margin-bottom: 10px; }
.advice-box ul { padding-left: 18px; }
.advice-box li { font-size: 14px; color: #666; line-height: 1.8; }
.disclaimer {
  font-size: 12px;
  color: #bbb;
  line-height: 1.6;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid #eee;
}
</style>
</head>
<body>
<div class="container">

<!-- 首页 -->
<div class="home" id="home">
  <h1>🌿 情绪状态自测</h1>
  <p class="sub">基于经典心理学量表，3分钟了解你当前的情绪状态</p >
  <div class="test-cards">
    <div class="card" onclick="startTest('sas')">
      <h3>焦虑自评量表（SAS）</h3>
      <p>评估你最近一周的焦虑感受，共20题，约3分钟</p >
      <span class="tag">适合：心慌、紧张、睡不好、容易担心</span>
    </div>
    <div class="card" onclick="startTest('pss')">
      <h3>压力知觉量表（PSS-10）</h3>
      <p>评估你最近一个月的压力感受，共10题，约2分钟</p >
      <span class="tag">适合：事情多、失控感、压力大</span>
    </div>
  </div>
</div>

<!-- 测试页 -->
<div class="test-page" id="testPage">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="q-header">
    <span class="q-num" id="qNum"></span>
    <span class="q-num" id="qTotal"></span>
  </div>
  <div class="q-text" id="qText"></div>
  <div class="options" id="options"></div>
  <div class="nav-btns">
    <button class="btn btn-prev" id="prevBtn" onclick="prevQ()">上一题</button>
    <button class="btn btn-next" id="nextBtn" onclick="nextQ()">下一题</button>
  </div>
</div>

<!-- 结果页 -->
<div class="result-page" id="resultPage">
  <h2 id="resultTitle"></h2>
  <p class="result-sub" id="resultSub"></p >
  <div class="score-circle" id="scoreCircle">
    <span id="scoreNum"></span>
    <span class="score-label" id="scoreLabel"></span>
  </div>
  <div class="level-tag" id="levelTag"></div>
  <div class="advice-box">
    <h4>💡 给你的小建议</h4>
    <ul id="adviceList"></ul>
  </div>
  <button class="btn btn-home" onclick="goHome()">返回首页，再测一次</button>
  <p class="disclaimer">
    本测评基于心理学常用自评量表，结果仅供参考，不构成医学诊断。 
    如你持续感到明显痛苦或影响日常生活，建议寻求专业心理咨询师或精神科医生的帮助。 
    量表来源：SAS（Zung, 1971）；PSS-10（Cohen et al., 1983）。
  </p >
</div>

</div>

<script>
// ===== 量表数据 =====
const sasQuestions = [
  "我觉得比平时容易紧张或着急",
  "我无缘无故感到害怕",
  "我容易心里烦乱或觉得惊恐",
  "我觉得我可能将要发疯",
  "我觉得一切都很好，也不会发生什么不幸",
  "我手脚发抖打颤",
  "我因为头痛、颈痛和背痛而苦恼",
  "我觉得容易衰弱和疲乏",
  "我觉得心平气和，并且容易安静坐着",
  "我觉得心跳得很快",
  "我因为一阵阵头晕而苦恼",
  "我有晕倒发作，或觉得要晕倒似的",
  "我呼气吸气都感到很容易",
  "我手脚麻木和刺痛",
  "我因为胃痛和消化不良而苦恼",
  "我常常要小便",
  "我的手常常是干燥温暖的",
  "我脸红发热",
  "我容易入睡并且一夜睡得很好",
  "我做恶梦"
];
// 正向题（分数越低越好）：4,8,12,16,17,19（0-indexed: 3,7,11,15,16,18）
const sasPositive = [3, 7, 11, 15, 16, 18];
const sasLabels = ["没有或很少时间", "小部分时间", "相当多时间", "绝大部分或全部时间"];

const pssQuestions = [
  "在过去一个月中，你因意外发生的事而感到心烦吗？",
  "在过去一个月中，你感到无法控制生活中重要的事吗？",
  "在过去一个月中，你感到紧张或有压力吗？",
  "在过去一个月中，你自信能处理自己的私人问题吗？",
  "在过去一个月中，你感到事情正按你的意愿发展吗？",
  "在过去一个月中，你发现自己无法处理所有必须做的事吗？",
  "在过去一个月中，你能够控制生活中的恼怒事情吗？",
  "在过去一个月中，你感到自己能够应付一切吗？",
  "在过去一个月中，你感到愤怒吗？",
  "在过去一个月中，你感到困难堆积太高，无法克服吗？"
];
// 正向题（反向计分）：3,4,6,7（0-indexed）
const pssPositive = [3, 4, 6, 7];
const pssLabels = ["从不", "几乎从不", "有时", " fairly often", "非常经常"];
const pssLabelsCN = ["从不", "几乎从不", "有时", "经常", "非常经常"];

// ===== 状态 =====
let currentTest = '';
let questions = [];
let positiveIdx = [];
let labels = [];
let answers = [];
let currentQ = 0;

function startTest(type) {
  currentTest = type;
  answers = [];
  currentQ = 0;
  if (type === 'sas') {
    questions = sasQuestions;
    positiveIdx = sasPositive;
    labels = sasLabels;
  } else {
    questions = pssQuestions;
    positiveIdx = pssPositive;
    labels = pssLabelsCN;
  }
  document.getElementById('home').style.display = 'none';
  document.getElementById('testPage').style.display = 'block';
  document.getElementById('resultPage').style.display = 'none';
  renderQ();
}

function renderQ() {
  const total = questions.length;
  document.getElementById('qNum').textContent = `第 ${currentQ + 1} 题`;
  document.getElementById('qTotal').textContent = `共 ${total} 题`;
  document.getElementById('qText').textContent = questions[currentQ];
  document.getElementById('progressFill').style.width = ((currentQ + 1) / total * 100) + '%';
  document.getElementById('prevBtn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = currentQ === total - 1 ? '查看结果' : '下一题';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  labels.forEach((l, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[currentQ] === i ? ' selected' : '');
    btn.textContent = l;
    btn.onclick = () => selectOpt(i);
    optsDiv.appendChild(btn);
  });
}

function selectOpt(i) {
  answers[currentQ] = i;
  renderQ();
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQ(); }
}

function nextQ() {
  if (answers[currentQ] === undefined) {
    alert('请先选择一个选项');
    return;
  }
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQ();
  } else {
    showResult();
  }
}

function calcScore() {
  let raw = 0;
  for (let i = 0; i < questions.length; i++) {
    let s = answers[i];
    if (positiveIdx.includes(i)) s = (labels.length - 1) - s; // 反向计分
    raw += s;
  }
  if (currentTest === 'sas') {
    return Math.round(raw * 1.25); // SAS标准分
  }
  return raw; // PSS直接求和
}

function showResult() {
  const score = calcScore();
  document.getElementById('testPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';

  let level, color, advice;

  if (currentTest === 'sas') {
    document.getElementById('resultTitle').textContent = '焦虑自评结果';
    document.getElementById('resultSub').textContent = 'SAS标准分（基于过去一周的感受）';
    document.getElementById('scoreLabel').textContent = '标准分';
    if (score < 50) {
      level = '正常范围';
      color = '#7cb342';
      advice = ['你的焦虑水平在正常范围内，继续保持。', '保持规律作息和适度运动，有助于维持良好情绪。', '如果偶尔感到紧张，可以尝试深呼吸或短暂散步。'];
    } else if (score < 60) {
      level = '轻度焦虑';
      color = '#ffa726';
      advice = ['你目前有一些焦虑感受，这在压力时期很常见。', '建议每天安排15分钟放松时间，如深呼吸、冥想或散步。', '减少咖啡因摄入，保持规律睡眠。', '如果焦虑感持续超过两周，可以考虑找心理咨询师聊聊。'];
    } else if (score < 70) {
      level = '中度焦虑';
      color = '#ef6c00';
      advice = ['你的焦虑水平偏高，身体可能已经发出信号。', '建议优先调整睡眠和运动，每天至少30分钟有氧活动。', '尝试记录焦虑想法，区分"真实威胁"和"过度担忧"。', '建议寻求专业心理咨询，获得更有针对性的帮助。'];
    } else {
      level = '重度焦虑';
      color = '#d32f2f';
      advice = ['你的焦虑水平较高，建议尽快寻求专业帮助。', '可以联系当地精神卫生中心或三甲医院心理科。', '在就医前，避免独处时反复思考负面内容，多和信任的人交流。', '请记住：焦虑是可以治疗的，主动求助是勇敢的表现。'];
    }
  } else {
    document.getElementById('resultTitle').textContent = '压力知觉结果';
    document.getElementById('resultSub').textContent = 'PSS-10总分（基于过去一个月的感受）';
    document.getElementById('scoreLabel').textContent = '总分';
    if (score <= 13) {
      level = '压力较低';
      color = '#7cb342';
      advice = ['你的压力水平较低，状态不错。', '继续保持当前的生活节奏和自我照顾方式。', '可以适当培养一些放松习惯，为未来可能的压力期做准备。'];
    } else if (score <= 26) {
      level = '中等压力';
      color = '#ffa726';
      advice = ['你正承受一定的压力，这是大多数人的常态。', '建议检查是否有"过度承担"的情况，学会拒绝不必要的任务。', '每天给自己留出30分钟"无任务时间"，做自己喜欢的事。', '和朋友聊聊，社会支持是缓解压力的有效方式。'];
    } else {
      level = '较高压力';
      color = '#d32f2f';
      advice = ['你的压力水平较高，可能已经影响身心健康。', '建议优先列出"必须做"和"可以不做"的事，减轻负担。', '尝试每天10分钟正念冥想，降低生理应激反应。', '如果压力已影响睡眠、食欲或工作，建议寻求专业心理咨询。'];
    }
  }

  document.getElementById('scoreNum').textContent = score;
  const circle = document.getElementById('scoreCircle');
  circle.style.background = color;
  const tag = document.getElementById('levelTag');
  tag.textContent = level;
  tag.style.background = color + '22';
  tag.style.color = color;
  const ul = document.getElementById('adviceList');
  ul.innerHTML = advice.map(a => `<li>${a}</li>`).join('');
}

function goHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('testPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'none';
}
</script>
</body>
</html>
